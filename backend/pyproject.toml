[tool.black]
line-length = 120
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "workoutsavings.settings"
python_files = ["tests.py", "test_*.py"]
filterwarnings = [
    # whitenoise: STATIC_ROOT only exists after collectstatic (done in the Docker image)
    "ignore:No directory at:UserWarning",
]
